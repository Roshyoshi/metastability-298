<text fill="#cccccc"  xml:space="preserve" font-size="9.68051" transform="translate(116.2, 120.269)" >starved pull-down MN + MC</text>
<text fill="#cccccc"  xml:space="preserve" font-size="9.68051" transform="translate(227.899, 89.2422)" >MCT: timing capacitor</text>
<text fill="#cccccc"  xml:space="preserve" font-size="14.5208" transform="translate(29.3239, 20.7299)" >F08  current-starved stage of the delay line: MP, MN, MC and the timing capacitor MCT</text>
<text fill="#cccccc"  xml:space="preserve" font-size="7.74441" transform="translate(29.3239, 41.1605)" >launch rises -&gt; MN turns on -&gt; slow discharges through MN and MC. The gate voltage ua[0] on MC limits that current,</text>
<text fill="#cccccc"  xml:space="preserve" font-size="7.74441" transform="translate(29.3239, 53.1525)" >so ua[0] sets how fast slow falls, i.e. the delay d. MCT (gate on slow) is the charge that has to be removed.</text>
<text fill="#cccccc"  xml:space="preserve" font-size="7.74441" transform="translate(147.228, 442.893)" >ua[0]: analog control voltage</text>
<text fill="#cccccc"  xml:space="preserve" font-size="7.74441" transform="translate(147.228, 467.715)" >slow: the ramp that sets d</text>
<text fill="#cccccc"  xml:space="preserve" font-size="6.45368" transform="translate(66.5567, 493.324)" >Rails: VDD at the top, VSS at the bottom; every PMOS body is on VDD and every NMOS body on VSS (drawn inside the symbol). A dot marks a connection; wires that cross without a dot are not connected.</text>
<text fill="#00ccee"  xml:space="preserve" font-size="10.6486" transform="translate(14.0807, 154.514)" >VDD</text>
<text fill="#00ccee"  xml:space="preserve" font-size="10.6486" transform="translate(16.0807, 415.143)" >VSS</text>
<text fill="#00ccee"  xml:space="preserve" font-size="10.6486" transform="translate(17.9214, 241.003)" >launch</text>
<text fill="#ff0000"  xml:space="preserve" font-size="10.6486" transform="translate(28.9214, 265.824)" >ua_0</text>
<text fill="#ffff00"  xml:space="preserve" font-size="10.6486" transform="translate(376.83, 253.413)" >slow</text>
<text fill="#ff0000"  xml:space="preserve" font-size="8.71246" transform="translate(106.06, 438.686)" >ua_0</text>
<text fill="#ffff00"  xml:space="preserve" font-size="8.71246" transform="translate(108.06, 463.507)" >slow</text>
