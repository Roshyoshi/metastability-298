<text fill="#cccccc"  xml:space="preserve" font-size="9.54293" transform="translate(113.517, 118.577)" >starved pull-down MN + MC</text>
<text fill="#cccccc"  xml:space="preserve" font-size="9.54293" transform="translate(223.628, 87.9911)" >MCT: timing capacitor</text>
<text fill="#cccccc"  xml:space="preserve" font-size="14.3144" transform="translate(27.8756, 20.4525)" >F08  current-starved stage of the delay line: MP, MN, MC and the timing capacitor MCT</text>
<text fill="#cccccc"  xml:space="preserve" font-size="7.63434" transform="translate(27.8756, 40.5927)" >launch rises -&gt; MN turns on -&gt; slow discharges through MN and MC. The gate voltage ua[0] on MC limits that current,</text>
<text fill="#cccccc"  xml:space="preserve" font-size="7.63434" transform="translate(27.8756, 52.4143)" >so ua[0] sets how fast slow falls, i.e. the delay d. MCT (gate on slow) is the charge that has to be removed.</text>
<text fill="#cccccc"  xml:space="preserve" font-size="7.63434" transform="translate(144.104, 436.616)" >ua[0]: analog control voltage</text>
<text fill="#cccccc"  xml:space="preserve" font-size="7.63434" transform="translate(144.104, 461.085)" >slow: the ramp that sets d</text>
<text fill="#cccccc"  xml:space="preserve" font-size="6.36195" transform="translate(64.5791, 486.33)" >Rails: VDD at the top, VSS at the bottom; every PMOS body is on VDD and every NMOS body on VSS (drawn inside the symbol). A dot marks a connection; wires that cross without a dot are not connected.</text>
<text fill="#00ccee"  xml:space="preserve" font-size="10.4972" transform="translate(13.5221, 152.335)" >VDD</text>
<text fill="#00ccee"  xml:space="preserve" font-size="10.4972" transform="translate(17.5221, 409.26)" >VSS</text>
<text fill="#00ccee"  xml:space="preserve" font-size="10.4972" transform="translate(21.1093, 237.594)" >launch</text>
<text fill="#ff0000"  xml:space="preserve" font-size="10.4972" transform="translate(30.1093, 262.064)" >ua_0</text>
<text fill="#ffff00"  xml:space="preserve" font-size="10.4972" transform="translate(370.442, 249.829)" >slow</text>
<text fill="#ff0000"  xml:space="preserve" font-size="8.58864" transform="translate(105.222, 432.468)" >ua_0</text>
<text fill="#ffff00"  xml:space="preserve" font-size="8.58864" transform="translate(106.222, 456.937)" >slow</text>
