# Tiny Tapeout project information
# Pin names follow the tt_um_metastability_characterizer subcircuit in
# netlist/chip.cdl. Layout follows TinyTapeout/ttgf-analog-template.
project:
  title: "Metastability measurement"
  author: "Benjamin J. Eisenberg and Roshan"
  discord: ""
  description: "GF180 early/late metastability measurement instrument"
  language: "Analog"
  clock_hz: 20000000

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x2"

  # How many analog pins does your project use? ua[0] only.
  analog_pins: 1
  uses_vapwr: false

  top_module: "tt_um_metastability_characterizer"

  # Source files must be in ./src. For an analog project this is the black
  # box of the top module (layout/tt_um_metastability_characterizer.v).
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "byte_sel"
  ui[1]: ""
  ui[2]: ""
  ui[3]: "dut_select[0]"
  ui[4]: "start"
  ui[5]: ""
  ui[6]: "data_in"
  ui[7]: ""

  # Outputs
  uo[0]: "result[0]"
  uo[1]: "result[1]"
  uo[2]: "result[2]"
  uo[3]: "result[3]"
  uo[4]: "result[4]"
  uo[5]: "result[5]"
  uo[6]: "result[6]"
  uo[7]: "result[7]"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: "busy"
  uio[2]: "done"
  uio[3]: "fault"
  uio[4]: "capture_monitor"
  uio[5]: "early_clock_monitor"
  uio[6]: "dut_select[1]"
  uio[7]: ""

  # Analog pins
  ua[0]: "delay_control"
  ua[1]: ""
  ua[2]: ""
  ua[3]: ""
  ua[4]: ""
  ua[5]: ""

# Do not change!
yaml_version: 6
